# Top-level Railway config — applies to the API service when this is the
# repo's only service. For multi-service deployments (api + workers), use
# the per-service configs in deploy/railway/ as templates and create one
# Railway service per role pointing at this repo.
#
# Reference: https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn janus.api.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/readyz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1
sleepApplication = false

# When you provision a Railway Postgres or Redis service, Railway exposes
# DATABASE_URL / REDIS_URL automatically when this service references them.
# Janus's settings layer hydrates POSTGRES_* / REDIS_* from those URLs.
