# Railway service: janus-api
# Public web service; speaks HTTP, validates API keys, fronts the workers.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn janus.api.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/readyz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1
sleepApplication = false

# Required env (set in Railway dashboard):
#   DATABASE_URL                  — auto-injected by Postgres service link
#   REDIS_URL                     — auto-injected by Redis service link
#   JANUS_ENV=paper|live
#   JANUS_API_API_KEY_PEPPER      — 32+ random chars, rotate to nuke all keys
#   JANUS_API_CORS_ALLOW_ORIGINS  — e.g. https://app.eazyycash.com (no spaces)
#   SENTRY_DSN                    — optional but recommended in prod
