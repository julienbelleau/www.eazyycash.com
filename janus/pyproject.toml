[tool.poetry]
name = "janus"
version = "0.1.0"
description = "Multi-strategy crypto trading system — Phase 0 (data infrastructure)"
authors = ["Ezcash <ops@eazyycash.com>"]
readme = "README.md"
packages = [{ include = "janus" }]

[tool.poetry.dependencies]
python = "^3.11"

# Trading + data
"ccxt" = { version = "^4.4", extras = ["pro"] }
pandas = "^2.2"
polars = "^0.20"
numpy = "^1.26"
scipy = "^1.13"
pandas-ta = "^0.3.14b"
talipp = "^2.4"

# Persistence
sqlalchemy = { version = "^2.0", extras = ["asyncio"] }
asyncpg = "^0.29"
psycopg2-binary = "^2.9"          # required by Alembic for sync migrations
alembic = "^1.13"
redis = { version = "^5.0", extras = ["hiredis"] }

# Statistique / ML (regime detection arrives in Phase 4 but we pin now for reproducibility)
scikit-learn = "^1.4"
statsmodels = "^0.14"
hmmlearn = "^0.3"
optuna = "^3.6"

# Backtest exploration
vectorbt = "^0.26"

# Config / runtime
pydantic = "^2.7"
pydantic-settings = "^2.3"
pyyaml = "^6.0"
httpx = "^0.27"
tenacity = "^8.3"
aiolimiter = "^1.1"
loguru = "^0.7"

# Observability
prometheus-client = "^0.20"
sentry-sdk = "^2.5"
python-telegram-bot = "^21.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
pytest-randomly = "^3.15"
hypothesis = "^6.103"
respx = "^0.21"
freezegun = "^1.5"
mypy = "^1.10"
ruff = "^0.4"
types-pyyaml = "^6.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

# ─────────────────────────── tooling config ───────────────────────────

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/", "build/"]

[[tool.mypy.overrides]]
module = ["ccxt.*", "vectorbt.*", "pandas_ta.*", "talipp.*", "hmmlearn.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "S", "C4", "SIM", "RET", "ASYNC", "ARG", "PT"]
# S101 = assert in tests is fine; S311 = non-crypto random in tests is fine.
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "ARG001", "ARG002"]
"alembic/versions/**" = ["E501"]
"scripts/**" = ["S603"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=janus",
    "--cov-report=term-missing",
]
markers = [
    "integration: requires running TimescaleDB+Redis (docker-compose up)",
    "slow: takes >5s",
    "live: hits a real external API — gated by JANUS_ENABLE_LIVE_TESTS=1",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["janus"]
omit = ["janus/data/loaders/coinglass.py", "janus/data/loaders/glassnode.py", "janus/data/loaders/defillama.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
