# Narrative Rotation — Phase 2 spec.
index:
  rebalance_freq_days: 7
  top_n_by_mcap: 10
  smoothing_ema_span: 5

signals:
  leader_window_days: 30
  decel_consecutive_days: 5
  emergent_momentum_rank_min: 2
  emergent_momentum_rank_max: 5

entry:
  positions_per_basket: 3
  pct_per_ticker: 4.0
  btc_dominance_max_change_14d_pct: 0.0    # neg or stable

exit:
  take_profit_basket_pct: 40
  stop_basket_pct: -15
  time_stop_days: 60

backtest:
  fees_taker_pct: 0.10
  slippage_pct: 0.15

gating:
  min_sharpe_oos: 1.2
  min_capture_ratio: 0.6
  max_drawdown_pct: 25.0

kill:
  sharpe_oos_below: 0.8
  min_distinct_narratives: 3
